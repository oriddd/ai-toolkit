name: ci

# Every PR must keep the catalogue consistent: validators, link check, hook behaviour tests,
# git modes / line endings, plugin version bumps and Claude Code's own manifest validation.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        experimental: [false]
        include:
          # Windows / Git Bash: hooks run there for many users. Non-blocking until it has proved stable.
          - os: windows-latest
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # check-versions needs the merge base
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install PyYAML (strict frontmatter parsing)
        run: python3 -m pip install pyyaml
      - name: Validators (skills, agents, plugins, language contract)
        run: bash tools/validate-skills.sh
      - name: Generated docs are in sync
        run: python3 tools/build-indexes.py --check
      - name: Eval suites are in sync with tools/eval_cases
        run: python3 tools/build-evals.py --check
      - name: Relative links
        run: python3 tools/check-links.py
      - name: Hook behaviour (commit guard, session start, detectors, wiring)
        run: bash tools/test-hooks.sh
      - name: Git modes and line endings
        run: bash tools/check-repo-hygiene.sh
      - name: Plugin version bump when content changed (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash tools/check-versions.sh "origin/$BASE_REF"
      - name: Plugin version bump when content changed (direct push)
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A new branch has an all-zero "before"; compare with the parent commit then.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE="HEAD~1"
          fi
          bash tools/check-versions.sh "$BEFORE"

  claude-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install Claude Code CLI (pinned)
        run: npm install -g @anthropic-ai/claude-code@2.1.309
      - name: Validate marketplace and every plugin (warnings fail the build)
        run: |
          set -u
          fail=0
          for target in . plugins/*/; do
            rc=0; out="$(claude plugin validate "$target" 2>&1)" || rc=$?   # bash -e: keep going after a failure
            echo "== $target"; echo "$out" | tail -3
            if [ $rc -ne 0 ] || echo "$out" | grep -Eq 'Found [0-9]+ (warning|error)'; then fail=1; fi
          done
          exit $fail
