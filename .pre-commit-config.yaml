# Optional: run the same fast gates locally before each commit, and the publication gate before each push.
#   pip install pre-commit && pre-commit install --hook-type pre-commit --hook-type pre-push
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: validate-skills
        name: validate skills, agents, plugins
        entry: bash tools/validate-skills.sh
        language: system
        pass_filenames: false
        files: ^(plugins|docs|tools|\.claude-plugin)/|^[^/]+$
      - id: check-links
        name: relative links resolve
        entry: python3 tools/check-links.py
        language: system
        pass_filenames: false
        types: [markdown]
      - id: test-hooks
        name: hook behaviour tests
        entry: bash tools/test-hooks.sh
        language: system
        pass_filenames: false
        files: ^(plugins/.*/hooks/|tools/test-hooks\.sh)
      - id: repo-hygiene
        name: git modes and line endings
        entry: bash tools/check-repo-hygiene.sh
        language: system
        pass_filenames: false
      - id: check-versions
        name: plugin version bumped when content changed
        entry: bash tools/check-versions.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: prepare-for-publish
        name: publication gate (junk files, confidential terms, history)
        entry: bash prepare-for-publish.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
